---
Configuration:
  status: WARN
  name: Integration Tests
  Appenders:
    Console:
        name: Console
        type: Console
        target: SYSTEM_OUT
        PatternLayout:
            pattern: "%d{yyyy-MM-dd HH:mm:ss:nnnn} %-5p <%t> %c{2.} - %m%replace{ %mdc}{' $'}{}%n"
  Loggers:
    Root:
      additivity: false
      AppenderRef:
        - ref: Console
          level: WARN
    Logger:
      - name: org.apache.kafka.common.utils.AppInfoParser
        additivity: false
        level: ERROR
        AppenderRef:
          - ref: Console
      -  name: kafka.server.BrokerMetadataCheckpoint
         additivity: false
         level: ERROR
         AppenderRef:
           - ref: Console

      -  name: io.kroxylicious.proxy
         additivity: false
         level: WARN
         AppenderRef:
           - ref: Console

      -  name: io.kroxylicious.test
         additivity: false
         level: WARN
         AppenderRef:
           - ref: Console

      -  name: io.kroxylicious.proxy.StartupShutdownLogger
         additivity: false
         level: DEBUG
         AppenderRef:
           - ref: Console

      -  name: io.kroxylicious.proxy.internal.ProxyChannelStateMachine
         additivity: false
         level: TRACE
         AppenderRef:
           - ref: Console

      -  name: io.kroxylicious.proxy.internal.HaProxyMessageHandler
         additivity: false
         level: TRACE
         AppenderRef:
           - ref: Console

      -  name: io.kroxylicious.proxy.testcluster
         additivity: false
         level: INFO
         AppenderRef:
           - ref: Console

      -  name: io.kroxylicious.proxy.filter.authorization
         additivity: false
         level: INFO

      -  name: io.kroxylicious.filter.entityisolation
         additivity: false
         level: INFO

         AppenderRef:
           - ref: Console

      -  name: org.apache.zookeeper
         additivity: false
         level: ERROR
         AppenderRef:
           - ref: Console

